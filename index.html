<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name In Landsat</title>

  <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', Arial, sans-serif;
    }

    body {
      background: #ececec;
      color: #111;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      min-height: 100px;
      background: #000;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      position: sticky;
      top: 0;
      z-index: 999;
      padding: 15px;
    }

    .logo {
      position: absolute;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0a43ff, #2dc7ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
      color: white;
    }

    .logo span {
      font-size: 24px;
      font-weight: 700;
    }

    .title {
      font-size: 52px;
      font-weight: 800;
      text-align: center;
    }

    .help-btn {
      position: absolute;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid white;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.3s;
      color: white;
    }

    .help-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .help-btn iconify-icon {
      font-size: 30px;
    }

    .popup {
      position: fixed;
      top: 110px;
      right: 20px;
      width: 340px;
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: none;
      z-index: 9999;
    }

    .popup.active {
      display: block;
    }

    .popup h3 {
      margin-bottom: 10px;
    }

    .popup p {
      line-height: 1.7;
      color: #333;
      margin-bottom: 15px;
    }

    .popup a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: black;
      color: white;
      padding: 12px 15px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      transition: background 0.2s;
    }

    .popup a:hover {
      background: #333;
    }

    .main {
      max-width: 1500px;
      margin: auto;
      padding: 40px 20px 80px;
    }

    .letters {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 14px;
      margin-bottom: 50px;
      padding-bottom: 10px;
      justify-content: flex-start;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      min-height: 300px;
    }

    .letter-card {
      flex: 0 0 auto;
      width: 170px;
      background: #999;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .letter-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
    }

    .image-wrapper {
      position: relative;
      cursor: pointer;
      overflow: hidden;
      background: #ddd;
    }

    .letter-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      transition: transform 0.3s;
    }

    .letter-card:hover img {
      transform: scale(1.05);
    }

    .location-tag {
      padding: 12px;
      background: rgba(0, 0, 0, 0.85);
      color: white;
    }

    .location-tag h4 {
      font-size: 13px;
      margin-bottom: 8px;
      font-weight: 500;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .open-btn {
      width: 100%;
      background: #1e5fff;
      border: none;
      padding: 8px;
      border-radius: 6px;
      color: white;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .open-btn:hover {
      background: #0a43ff;
    }

    .controls {
      text-align: center;
    }

    .controls p {
      font-size: 26px;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .input-wrap {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: white;
      padding: 12px;
      border-radius: 18px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
    }

    input {
      width: 320px;
      height: 58px;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 0 16px;
      font-size: 20px;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: #1e5fff;
      box-shadow: 0 0 0 3px rgba(30, 95, 255, 0.1);
    }

    button {
      height: 58px;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      cursor: pointer;
      background: #111;
      color: white;
      font-size: 18px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    button:hover {
      background: #333;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    button:focus-visible {
      outline: 3px solid #1e5fff;
      outline-offset: 2px;
    }

    .warning {
      background: #ffdd99;
      border-left: 5px solid #ff8800;
      padding: 12px 20px;
      margin: 20px auto;
      border-radius: 10px;
      display: inline-block;
      color: #333;
    }

    .empty-state {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: #666;
      font-size: 18px;
      text-align: center;
    }

    .empty-state iconify-icon {
      font-size: 64px;
      margin-bottom: 16px;
      color: #999;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    @media (max-width: 900px) {
      .title {
        font-size: 30px;
        padding: 0 70px;
      }

      .logo span {
        display: none;
      }

      .letter-card {
        width: 140px;
      }

      .controls p {
        font-size: 18px;
      }

      input {
        width: 100%;
      }

      .input-wrap {
        width: 100%;
      }

      button {
        flex: 1;
        justify-content: center;
      }

      .popup {
        width: calc(100% - 30px);
        right: 15px;
      }

      .location-tag h4 {
        font-size: 11px;
        white-space: normal;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-circle" aria-hidden="true">LS</div>
    <span>Landsat Science</span>
  </div>

  <h1 class="title" id="mainTitle">Your Name In Landsat</h1>

  <button class="help-btn" id="helpBtn" aria-label="About this project" title="About">
    <iconify-icon icon="mdi:help-circle-outline" aria-hidden="true"></iconify-icon>
  </button>
</header>

<div class="popup" id="popup" role="dialog" aria-labelledby="popup-title" aria-hidden="true">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
    <h3 id="popup-title">About</h3>
    <button id="closePopup" style="background: none; border: none; font-size: 24px; cursor: pointer; color: black; height: auto; padding: 0;" aria-label="Close popup">✕</button>
  </div>
  <p>
    All those images were taken by NASA / Landsat.<br><br>
    This site is fully made by PIReactive Rwanda.
  </p>
  <a href="https://pireactive.vercel.app/about" target="_blank" rel="noopener noreferrer">
    Contact for a FREE WEBSITE
    <iconify-icon icon="mdi:open-in-new" aria-hidden="true"></iconify-icon>
  </a>
</div>

<main class="main">
  <div class="letters" id="lettersContainer" role="list" aria-label="Landsat letter images">
    <div class="empty-state" id="emptyState">
      <iconify-icon icon="mdi:earth" aria-hidden="true"></iconify-icon>
      <p>Loading image database...</p>
    </div>
  </div>

  <div class="controls">
    <p>Type in your name to see it spelled out in Landsat imagery of Earth!</p>

    <div class="input-wrap">
      <label for="nameInput" class="sr-only">Enter your name</label>
      <input type="text" id="nameInput" placeholder="LANDSAT, NAME, TYPE" maxlength="15" autocomplete="off" aria-describedby="warningMsg" />
      <button id="generateBtn" aria-label="Generate Landsat images">
        <iconify-icon icon="mdi:keyboard-return" aria-hidden="true"></iconify-icon>
        Enter
      </button>
      <button id="downloadBtn" aria-label="Download images">
        <iconify-icon icon="mdi:download" aria-hidden="true"></iconify-icon>
        Download
      </button>
    </div>
    <div id="warningMsg" style="margin-top: 15px;" role="alert" aria-live="polite"></div>
  </div>
</main>

<!-- Load the image database -->
<script src="images.js"></script>

<script>
(function() {
  'use strict';

  // Wait for DOM and database to be ready
  function initializeApp() {
    // DOM elements
    const nameInput = document.getElementById('nameInput');
    const generateBtn = document.getElementById('generateBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const helpBtn = document.getElementById('helpBtn');
    const closePopup = document.getElementById('closePopup');
    const popup = document.getElementById('popup');
    const lettersContainer = document.getElementById('lettersContainer');
    const mainTitle = document.getElementById('mainTitle');
    const warningMsg = document.getElementById('warningMsg');
    const emptyState = document.getElementById('emptyState');

    // State
    let currentCardsData = [];
    let currentNameRaw = '';
    let isProcessing = false;

    // Check if database exists
    function checkDatabase() {
      if (typeof earthDatabase === 'undefined' || !earthDatabase) {
        emptyState.innerHTML = `
          <iconify-icon icon="mdi:database-off" aria-hidden="true"></iconify-icon>
          <p>Image database not loaded.<br>Please make sure images.js exists and is properly configured.</p>
        `;
        emptyState.style.display = 'flex';
        return false;
      }
      return true;
    }

    // Show warning message
    function showWarning(msg) {
      warningMsg.innerHTML = `<div class="warning" role="alert">⚠️ ${msg}</div>`;
      clearTimeout(window.warningTimeout);
      window.warningTimeout = setTimeout(() => {
        warningMsg.innerHTML = '';
      }, 4000);
    }

    // Open location in Google Maps
    function openGoogleMaps(lat, lon) {
      if (lat && lon) {
        window.open(`https://www.google.com/maps?q=${lat},${lon}&z=12`, '_blank', 'noopener,noreferrer');
      }
    }

    // Render letter cards
    function renderCards(cardsArray, nameString) {
      if (!cardsArray || cardsArray.length === 0) {
        if (emptyState) {
          emptyState.style.display = 'flex';
          emptyState.innerHTML = `
            <iconify-icon icon="mdi:earth" aria-hidden="true"></iconify-icon>
            <p>Type a name to see it in Landsat imagery</p>
          `;
        }
        lettersContainer.innerHTML = '';
        lettersContainer.appendChild(emptyState);
        return;
      }

      // Hide empty state
      if (emptyState) {
        emptyState.style.display = 'none';
      }

      // Clear container
      lettersContainer.innerHTML = '';

      // Create document fragment for better performance
      const fragment = document.createDocumentFragment();

      cardsArray.forEach((card, idx) => {
        const letter = nameString[idx] || '';
        
        const cardDiv = document.createElement('div');
        cardDiv.className = 'letter-card';
        cardDiv.setAttribute('role', 'listitem');
        cardDiv.setAttribute('aria-label', `Letter ${letter.toUpperCase()} - ${card.place || 'Unknown location'}`);

        // Image wrapper
        const imageWrapper = document.createElement('div');
        imageWrapper.className = 'image-wrapper';
        imageWrapper.setAttribute('role', 'button');
        imageWrapper.setAttribute('tabindex', '0');
        imageWrapper.setAttribute('aria-label', `View ${card.place || 'location'} on Google Maps`);
        imageWrapper.addEventListener('click', () => openGoogleMaps(card.lat, card.lon));
        imageWrapper.addEventListener('keypress', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openGoogleMaps(card.lat, card.lon);
          }
        });

        // Image
        const img = document.createElement('img');
        img.src = card.img || '';
        img.alt = `Landsat satellite image of ${card.place || 'Earth'} showing letter ${letter.toUpperCase()}`;
        img.loading = 'lazy';
        
        // Error handling for images
        img.onerror = function() {
          this.src = 'data:image/svg+xml,' + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" width="170" height="170">
              <rect fill="%23e0e0e0" width="170" height="170"/>
              <text fill="%23999999" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" x="85" y="85">Image</text>
              <text fill="%23999999" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" x="85" y="105">Unavailable</text>
            </svg>
          `);
          this.alt = 'Image not available';
        };

        img.onload = function() {
          this.style.opacity = '1';
        };

        img.style.opacity = '0';
        img.style.transition = 'opacity 0.3s';

        imageWrapper.appendChild(img);

        // Location info
        const infoDiv = document.createElement('div');
        infoDiv.className = 'location-tag';

        const title = document.createElement('h4');
        title.textContent = card.place || 'Unknown location';
        title.title = card.place || 'Unknown location';

        const openBtn = document.createElement('button');
        openBtn.className = 'open-btn';
        openBtn.innerHTML = '<iconify-icon icon="mdi:map-marker" aria-hidden="true"></iconify-icon> Open →';
        openBtn.setAttribute('aria-label', `Open ${card.place || 'location'} on Google Maps`);
        openBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          openGoogleMaps(card.lat, card.lon);
        });

        infoDiv.appendChild(title);
        infoDiv.appendChild(openBtn);

        cardDiv.appendChild(imageWrapper);
        cardDiv.appendChild(infoDiv);

        fragment.appendChild(cardDiv);
      });

      lettersContainer.appendChild(fragment);
    }

    // Generate name from input
    function generateName() {
      if (isProcessing) return;
      
      if (!checkDatabase()) return;

      const input = nameInput.value.trim();
      
      if (!input) {
        showWarning('Please enter a name!');
        return;
      }

      // Allow only letters
      const sanitized = input.toLowerCase().replace(/[^a-z]/g, '');
      
      if (sanitized.length === 0) {
        showWarning('Please use only letters (A-Z) in your name.');
        return;
      }

      if (sanitized.length > 15) {
        showWarning('Maximum 15 characters allowed.');
        return;
      }

      isProcessing = true;
      generateBtn.disabled = true;

      try {
        const cards = [];

        for (let letter of sanitized) {
          const options = earthDatabase[letter];
          
          if (!options || !Array.isArray(options) || options.length === 0) {
            showWarning(`No satellite images available for letter "${letter.toUpperCase()}".`);
            isProcessing = false;
            generateBtn.disabled = false;
            return;
          }

          // Filter valid options
          const validOptions = options.filter(opt => opt && opt.img);
          
          if (validOptions.length === 0) {
            showWarning(`No valid images for letter "${letter.toUpperCase()}".`);
            isProcessing = false;
            generateBtn.disabled = false;
            return;
          }

          // Pick random image
          const randomIndex = Math.floor(Math.random() * validOptions.length);
          cards.push({ ...validOptions[randomIndex] });
        }

        currentCardsData = cards;
        currentNameRaw = sanitized;
        mainTitle.textContent = sanitized.toUpperCase() + ' In Landsat';
        renderCards(cards, sanitized);
        
      } catch (error) {
        console.error('Error generating name:', error);
        showWarning('An error occurred. Please try again.');
      } finally {
        isProcessing = false;
        generateBtn.disabled = false;
      }
    }

    // Download combined image
    async function downloadCombinedImage() {
      if (currentCardsData.length === 0) {
        showWarning('Generate a name first before downloading!');
        return;
      }

      const cards = document.querySelectorAll('.letter-card');
      if (cards.length === 0) {
        showWarning('No images to download.');
        return;
      }

      downloadBtn.disabled = true;
      downloadBtn.innerHTML = '<iconify-icon icon="mdi:loading" aria-hidden="true"></iconify-icon> Preparing...';

      try {
        const firstCard = cards[0];
        const width = firstCard.offsetWidth;
        const height = firstCard.offsetHeight;

        if (width === 0 || height === 0) {
          throw new Error('Cannot determine image dimensions');
        }

        // Create canvas
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        // Higher quality with device pixel ratio
        const scale = 2;
        canvas.width = width * cards.length * scale;
        canvas.height = height * scale;
        ctx.scale(scale, scale);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width * cards.length, height);

        // Load and draw each image
        for (let index = 0; index < cards.length; index++) {
          const imgElement = cards[index].querySelector('img');
          if (!imgElement || !imgElement.src) continue;
          
          try {
            await new Promise((resolve, reject) => {
              const img = new Image();
              img.crossOrigin = 'anonymous';
              
              const timeout = setTimeout(() => {
                reject(new Error('Image load timeout'));
              }, 5000);
              
              img.onload = () => {
                clearTimeout(timeout);
                ctx.drawImage(img, index * width, 0, width, height);
                resolve();
              };
              
              img.onerror = () => {
                clearTimeout(timeout);
                // Draw placeholder on error
                ctx.fillStyle = '#e0e0e0';
                ctx.fillRect(index * width, 0, width, height);
                ctx.fillStyle = '#999999';
                ctx.font = '14px Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Image unavailable', index * width + width/2, height/2);
                resolve(); // Continue despite error
              };
              
              img.src = imgElement.src;
            });
          } catch (err) {
            console.warn('Failed to load image:', err);
            // Draw placeholder
            ctx.fillStyle = '#e0e0e0';
            ctx.fillRect(index * width, 0, width, height);
            ctx.fillStyle = '#999999';
            ctx.font = '14px Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Image unavailable', index * width + width/2, height/2);
          }
        }

        // Convert to blob and download
        canvas.toBlob((blob) => {
          if (blob) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            const name = currentNameRaw || 'landsat';
            const timestamp = new Date().toISOString().slice(0, 10);
            link.download = `${name}_landsat_${timestamp}.png`;
            link.href = url;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            setTimeout(() => URL.revokeObjectURL(url), 1000);
          } else {
            showWarning('Failed to create image. Please try again.');
          }
        }, 'image/png', 1.0);

      } catch (error) {
        console.error('Download failed:', error);
        showWarning('Failed to download images. Please try again.');
      } finally {
        downloadBtn.disabled = false;
        downloadBtn.innerHTML = '<iconify-icon icon="mdi:download" aria-hidden="true"></iconify-icon> Download';
      }
    }

    // Toggle popup
    function openPopup() {
      popup.classList.add('active');
      popup.setAttribute('aria-hidden', 'false');
      closePopup.focus();
    }

    function closePopupFn() {
      popup.classList.remove('active');
      popup.setAttribute('aria-hidden', 'true');
    }

    // Event listeners
    generateBtn.addEventListener('click', generateName);
    
    downloadBtn.addEventListener('click', downloadCombinedImage);
    
    helpBtn.addEventListener('click', openPopup);
    
    closePopup.addEventListener('click', closePopupFn);
    
    nameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        generateName();
      }
    });

    // Filter non-letter characters on input
    nameInput.addEventListener('input', function(e) {
      const cursorPos = this.selectionStart;
      const oldValue = this.value;
      const newValue = oldValue.replace(/[^a-zA-Z\s]/g, '');
      
      if (oldValue !== newValue) {
        this.value = newValue;
        const posDiff = oldValue.length - newValue.length;
        this.setSelectionRange(cursorPos - posDiff, cursorPos - posDiff);
      }
    });

    // Close popup when clicking outside
    document.addEventListener('click', function(e) {
      if (popup.classList.contains('active') && 
          !popup.contains(e.target) && 
          e.target !== helpBtn &&
          !helpBtn.contains(e.target)) {
        closePopupFn();
      }
    });

    // Close popup with Escape key
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && popup.classList.contains('active')) {
        closePopupFn();
        helpBtn.focus();
      }
    });

    // Initialize application
    function init() {
      if (checkDatabase()) {
        nameInput.value = 'LANDSAT';
        // Small delay to ensure everything is ready
        setTimeout(() => {
          generateName();
        }, 100);
      } else {
        emptyState.style.display = 'flex';
      }
    }

    // Start the app
    init();
  }

  // Start when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeApp);
  } else {
    initializeApp();
  }

})();
</script>

</body>
</html>
