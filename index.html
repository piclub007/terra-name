<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name In Landsat</title>

  <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', Arial, sans-serif;
    }

    body {
      background: #ececec;
      color: #111;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      min-height: 100px;
      background: #000;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      position: sticky;
      top: 0;
      z-index: 999;
      padding: 15px;
    }

    .logo {
      position: absolute;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0a43ff, #2dc7ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
    }

    .logo span {
      font-size: 24px;
      font-weight: 700;
    }

    .title {
      font-size: 52px;
      font-weight: 800;
      text-align: center;
    }

    .help-btn {
      position: absolute;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.3s;
    }

    .help-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .help-btn iconify-icon {
      font-size: 30px;
    }

    .popup {
      position: fixed;
      top: 110px;
      right: 20px;
      width: 340px;
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: none;
      z-index: 9999;
    }

    .popup h3 {
      margin-bottom: 10px;
    }

    .popup p {
      line-height: 1.7;
      color: #333;
      margin-bottom: 15px;
    }

    .popup a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: black;
      color: white;
      padding: 12px 15px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
    }

    .main {
      max-width: 1500px;
      margin: auto;
      padding: 40px 20px 80px;
    }

    .letters {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 14px;
      margin-bottom: 50px;
      padding-bottom: 10px;
      justify-content: flex-start;
      scroll-behavior: smooth;
    }

    .letter-card {
      flex: 0 0 auto;
      width: 170px;
      background: #999;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .letter-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
    }

    .image-wrapper {
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    .letter-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      transition: transform 0.3s;
    }

    .letter-card:hover img {
      transform: scale(1.05);
    }

    .location-tag {
      padding: 12px;
      background: rgba(0, 0, 0, 0.85);
      color: white;
    }

    .location-tag h4 {
      font-size: 13px;
      margin-bottom: 8px;
      font-weight: 500;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .open-btn {
      width: 100%;
      background: #1e5fff;
      border: none;
      padding: 8px;
      border-radius: 6px;
      color: white;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .open-btn:hover {
      background: #0a43ff;
    }

    .controls {
      text-align: center;
    }

    .controls p {
      font-size: 26px;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .input-wrap {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      background: white;
      padding: 12px;
      border-radius: 18px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
    }

    input {
      width: 320px;
      height: 58px;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 0 16px;
      font-size: 20px;
      outline: none;
    }

    button {
      height: 58px;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      cursor: pointer;
      background: #111;
      color: white;
      font-size: 18px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.97);
    }

    button:hover {
      background: #333;
    }

    .warning {
      background: #ffdd99;
      border-left: 5px solid #ff8800;
      padding: 12px 20px;
      margin: 20px auto;
      border-radius: 10px;
      display: inline-block;
    }

    @media (max-width: 900px) {
      .title {
        font-size: 30px;
        padding: 0 70px;
      }

      .logo span {
        display: none;
      }

      .letter-card {
        width: 140px;
      }

      .controls p {
        font-size: 18px;
      }

      input {
        width: 100%;
      }

      .input-wrap {
        width: 100%;
      }

      button {
        flex: 1;
        justify-content: center;
      }

      .popup {
        width: calc(100% - 30px);
        right: 15px;
      }

      .location-tag h4 {
        font-size: 11px;
        white-space: normal;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-circle">LS</div>
    <span>Landsat Science</span>
  </div>

  <div class="title" id="mainTitle">Your Name In Landsat</div>

  <div class="help-btn" onclick="togglePopup()">
    <iconify-icon icon="mdi:help-circle-outline"></iconify-icon>
  </div>
</header>

<div class="popup" id="popup">
  <h3>About</h3>
  <p>
    All those images were taken by NASA / Landsat.<br><br>
    This site is fully made by PIReactive Rwanda.
  </p>

  <a href="https://pireactive.vercel.app/about" target="_blank">
    Contact for a FREE WEBSITE
    <iconify-icon icon="mdi:open-in-new"></iconify-icon>
  </a>
</div>

<section class="main">
  <div class="letters" id="lettersContainer"></div>

  <div class="controls">
    <p>Type in your name to see it spelled out in Landsat imagery of Earth!</p>

    <div class="input-wrap">
      <input type="text" id="nameInput" placeholder="Enter a name (max 15)" maxlength="15" autocomplete="off" />
      <button onclick="generateName()">
        <iconify-icon icon="mdi:keyboard-return"></iconify-icon>
        Enter
      </button>
      <button onclick="randomizeLetters()">
        <iconify-icon icon="mdi:dice-multiple"></iconify-icon>
        Random
      </button>
      <button onclick="downloadCombinedImage()">
        <iconify-icon icon="mdi:download"></iconify-icon>
        Download
      </button>
    </div>
    <div id="warningMsg" style="margin-top: 15px;"></div>
  </div>
</section>

<script src="info.js"></script>
<script>
  let currentCardsData = [];
  let currentNameRaw = '';

  function showWarning(msg) {
    const warnDiv = document.getElementById('warningMsg');
    warnDiv.innerHTML = `<div class="warning">⚠️ ${msg}</div>`;
    setTimeout(() => {
      if (warnDiv.innerHTML === `<div class="warning">⚠️ ${msg}</div>`) {
        warnDiv.innerHTML = '';
      }
    }, 3000);
  }

  function togglePopup() {
    const popup = document.getElementById('popup');
    popup.style.display = popup.style.display === 'block' ? 'none' : 'block';
  }

  function openGoogleMaps(lat, lon) {
    window.open(`https://www.google.com/maps?q=${lat},${lon}&z=12`, '_blank');
  }

  function renderCards(cardsArray, nameString) {
    const container = document.getElementById('lettersContainer');
    container.innerHTML = '';

    if (!cardsArray || cardsArray.length === 0) return;

    cardsArray.forEach((card, idx) => {
      const cardDiv = document.createElement('div');
      cardDiv.className = 'letter-card';

      const imageWrapper = document.createElement('div');
      imageWrapper.className = 'image-wrapper';
      imageWrapper.onclick = () => openGoogleMaps(card.lat, card.lon);

      const img = document.createElement('img');
      img.src = card.img;
      img.alt = nameString[idx] || 'letter';
      img.loading = 'lazy';
      img.onerror = () => {
        img.src = 'https://eoimages.gsfc.nasa.gov/images/imagerecords/57000/57732/amazon_oli_2014114_lrg.jpg';
      };

      imageWrapper.appendChild(img);

      const infoDiv = document.createElement('div');
      infoDiv.className = 'location-tag';

      const title = document.createElement('h4');
      title.textContent = card.place;

      const openBtn = document.createElement('button');
      openBtn.className = 'open-btn';
      openBtn.innerHTML = '<iconify-icon icon="mdi:map-marker"></iconify-icon> Open →';
      openBtn.onclick = (e) => {
        e.stopPropagation();
        openGoogleMaps(card.lat, card.lon);
      };

      infoDiv.appendChild(title);
      infoDiv.appendChild(openBtn);

      cardDiv.appendChild(imageWrapper);
      cardDiv.appendChild(infoDiv);

      container.appendChild(cardDiv);
    });
  }

  function generateName() {
    const input = document.getElementById('nameInput').value.trim().toLowerCase();
    
    if (!input) {
      showWarning('Please enter a name!');
      return;
    }

    if (input.length > 15) {
      showWarning(`Maximum 15 characters. "${input}" has ${input.length}.`);
      return;
    }

    if (!window.earthDatabase) {
      showWarning('Database not loaded. Make sure info.js is in the same folder.');
      return;
    }

    currentNameRaw = input;
    const cards = [];

    for (let letter of input) {
      const options = window.earthDatabase[letter];
      if (!options || options.length === 0) {
        showWarning(`Letter "${letter.toUpperCase()}" not available in database.`);
        return;
      }
      const randomIndex = Math.floor(Math.random() * options.length);
      cards.push({ ...options[randomIndex] });
    }

    currentCardsData = cards;
    document.getElementById('mainTitle').textContent = input.toUpperCase() + ' In Landsat';
    renderCards(cards, input);
  }

  function randomizeLetters() {
    if (!currentNameRaw || currentCardsData.length === 0) {
      showWarning('Generate a name first!');
      return;
    }

    const newCards = [];
    for (let letter of currentNameRaw) {
      const options = window.earthDatabase[letter];
      if (options && options.length > 0) {
        const randomIndex = Math.floor(Math.random() * options.length);
        newCards.push({ ...options[randomIndex] });
      }
    }

    if (newCards.length === currentNameRaw.length) {
      currentCardsData = newCards;
      renderCards(newCards, currentNameRaw);
    }
  }

  async function downloadCombinedImage() {
    const cards = document.querySelectorAll('.letter-card');

    if (cards.length === 0) {
      showWarning('Generate a name first!');
      return;
    }

    const firstCard = cards[0];
    const width = firstCard.offsetWidth;
    const height = firstCard.offsetHeight;

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    canvas.width = width * cards.length;
    canvas.height = height;

    let loaded = 0;

    for (let index = 0; index < cards.length; index++) {
      const card = cards[index];
      const img = card.querySelector('img');
      
      await new Promise((resolve) => {
        const tempImg = new Image();
        tempImg.crossOrigin = 'Anonymous';
        tempImg.src = img.src;

        tempImg.onload = () => {
          ctx.drawImage(tempImg, index * width, 0, width, height);
          loaded++;
          resolve();
        };

        tempImg.onerror = () => {
          loaded++;
          resolve();
        };
      });
    }

    if (loaded === cards.length) {
      const link = document.createElement('a');
      const name = currentNameRaw || 'landsat';
      link.download = `${name}_landsat.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  }

  // Default demo on page load
  setTimeout(() => {
    if (window.earthDatabase) {
      document.getElementById('nameInput').value = 'BERTRAND';
      generateName();
    } else {
      showWarning('Waiting for database... Make sure info.js is loaded.');
    }
  }, 100);
</script>
</body>
</html>
