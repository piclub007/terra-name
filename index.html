<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name In Landsat</title>

  <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      background: #ececec;
      color: #111;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      min-height: 100px;
      background: #000;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      position: sticky;
      top: 0;
      z-index: 999;
      padding: 15px;
    }

    .logo {
      position: absolute;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg,#0a43ff,#2dc7ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
    }

    .logo span {
      font-size: 24px;
      font-weight: 700;
    }

    .title {
      font-size: 52px;
      font-weight: 800;
      text-align: center;
    }

    .help-btn {
      position: absolute;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.3s;
    }

    .help-btn:hover {
      background: rgba(255,255,255,0.15);
    }

    .help-btn iconify-icon {
      font-size: 30px;
    }

    .popup {
      position: fixed;
      top: 110px;
      right: 20px;
      width: 340px;
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: none;
      z-index: 9999;
    }

    .popup h3 {
      margin-bottom: 10px;
    }

    .popup p {
      line-height: 1.7;
      color: #333;
      margin-bottom: 15px;
    }

    .popup a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: black;
      color: white;
      padding: 12px 15px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
    }

    .main {
      max-width: 1500px;
      margin: auto;
      padding: 40px 20px 80px;
    }

    .letters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-bottom: 50px;
    }

    .letter-card {
      width: 170px;
      height: 430px;
      overflow: hidden;
      border-radius: 6px;
      background: #999;
      position: relative;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
      transition: 0.3s;
    }

    .letter-card:hover {
      transform: translateY(-4px);
    }

    .letter-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .location-tag {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
      color: white;
      padding: 20px 12px 12px;
    }

    .location-tag h4 {
      font-size: 16px;
      margin-bottom: 6px;
    }

    .location-tag p {
      font-size: 12px;
      opacity: 0.9;
    }

    .controls {
      text-align: center;
    }

    .controls p {
      font-size: 26px;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .input-wrap {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      background: white;
      padding: 12px;
      border-radius: 18px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.1);
    }

    input {
      width: 320px;
      height: 58px;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 0 16px;
      font-size: 20px;
      outline: none;
    }

    button {
      height: 58px;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      cursor: pointer;
      background: #111;
      color: white;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button iconify-icon {
      font-size: 22px;
    }

    @media(max-width: 900px){
      .title {
        font-size: 30px;
        padding: 0 70px;
      }

      .logo span {
        display: none;
      }

      .letter-card {
        width: 120px;
        height: 300px;
      }

      .controls p {
        font-size: 18px;
      }

      input {
        width: 100%;
      }

      .input-wrap {
        width: 100%;
      }

      button {
        flex: 1;
        justify-content: center;
      }

      .popup {
        width: calc(100% - 30px);
        right: 15px;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-circle">LS</div>
    <span>Landsat Science</span>
  </div>

  <div class="title" id="mainTitle">Your Name In Landsat</div>

  <div class="help-btn" onclick="togglePopup()">
    <iconify-icon icon="mdi:help-circle-outline"></iconify-icon>
  </div>
</header>

<div class="popup" id="popup">
  <h3>About</h3>
  <p>
    All those images were taken by NASA.<br><br>
    This site is fully made by PIReactive Rwanda.
  </p>

  <a href="https://pireactive.vercel.app/about" target="_blank">
    Contact for a FREE WEBSITE
    <iconify-icon icon="mdi:open-in-new"></iconify-icon>
  </a>
</div>

<section class="main">

  <div class="letters" id="lettersContainer"></div>

  <div class="controls">
    <p>Type in your name to see it spelled out in Landsat imagery of Earth!</p>

    <div class="input-wrap">
      <input type="text" id="nameInput" placeholder="Enter a name" />

      <button onclick="generateName()">
        <iconify-icon icon="mdi:keyboard-return"></iconify-icon>
        Enter
      </button>

      <button onclick="downloadCombinedImage()">
        <iconify-icon icon="mdi:download"></iconify-icon>
        Download
      </button>
    </div>
  </div>

</section>

<script>

function togglePopup(){
  const popup = document.getElementById('popup');
  popup.style.display = popup.style.display === 'block' ? 'none' : 'block';
}

function generateName(){

  const input = document.getElementById('nameInput').value.trim().toLowerCase();
  const container = document.getElementById('lettersContainer');

  container.innerHTML = '';

  if(!input) return;

  document.getElementById('mainTitle').textContent = input.toUpperCase() + ' In Landsat';

  for(let letter of input){

    if(lettersDB[letter]){

      const variants = lettersDB[letter];
      const chosen = variants[Math.floor(Math.random()*variants.length)];

      const card = document.createElement('div');
      card.className = 'letter-card';

      card.innerHTML = `
        <img src="${chosen.img}" alt="${letter}">

        <div class="location-tag">
          <h4>${chosen.place}</h4>
          <p>${chosen.coords}</p>
        </div>
      `;

      container.appendChild(card);
    }
  }
}

async function downloadCombinedImage(){

  const cards = document.querySelectorAll('.letter-card img');

  if(cards.length === 0){
    alert('Generate a name first.');
    return;
  }

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  const width = 170;
  const height = 430;

  canvas.width = width * cards.length;
  canvas.height = height;

  let loaded = 0;

  cards.forEach((card,index)=>{

    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = card.src;

    img.onload = ()=>{
      ctx.drawImage(img,index*width,0,width,height);

      loaded++;

      if(loaded === cards.length){

        const link = document.createElement('a');
        link.download = 'landsat-name.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      }
    }
  });
}

generateName();

</script>

</body>
</html>
